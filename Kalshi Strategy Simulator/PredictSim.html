document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

adius:4px;width:60px;text-align:center;\">{{ f.liq }}<\u002Fspan>\n                <div style=\"flex:1;min-width:0;\">\n                  <div style=\"font-size:12px;color:#d4d4d9;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{ f.title }}<\u002Fdiv>\n                  <div style=\"font-family:'Geist Mono',monospace;font-size:9.5px;color:#52525b;margin-top:1px;\">{{ f.detail }}<\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font-family:'Geist Mono',monospace;font-size:11.5px;font-weight:500;color:{{ f.noteColor }};font-variant-numeric:tabular-nums;white-space:nowrap;\">{{ f.note }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-top:20px;padding-top:14px;border-top:1px solid #18181b;\">\n      <span style=\"font-family:'Geist Mono',monospace;font-size:10.5px;color:#3f3f46;\">paper-sim run --strategy weather,macro --cash {{ cashFlag }} --fill {{ fillChip }}<\u002Fspan>\n      <span style=\"font-family:'Geist Mono',monospace;font-size:10.5px;color:#3f3f46;\">artifacts → runs/{{ runId }}/ · report.html<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;justify-content:center;margin-top:36px;\">\n      <img src=\"7c8d44af-5819-416d-8f93-363ddfa70f9e\" alt=\"PredictSim\" style=\"height:65px;width:auto;display:block;opacity:0.9;\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1180},&quot;startingCash&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:50,&quot;min&quot;:10,&quot;max&quot;:1000,&quot;step&quot;:10,&quot;tsType&quot;:&quot;number&quot;},&quot;makerFillModel&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;level1&quot;,&quot;options&quot;:[&quot;level0&quot;,&quot;level1&quot;,&quot;level2&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;markToMarket&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;bid&quot;,&quot;options&quot;:[&quot;bid&quot;,&quot;mid&quot;],&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  startCents = (this.props.startingCash ?? 50) * 100;\n\n  state = {\n    running: true,\n    speed: 4,\n    fillModel: this.props.makerFillModel ?? \"level1\",\n    mtm: this.props.markToMarket ?? \"bid\",\n    tick: 142,\n    simMs: Date.UTC(2026, 5, 20, 13, 35, 0),\n    wallet: { cash: this.startCents + 313, reserved: 0, fees: 11 },\n    positions: {},\n    orders: [],\n    fills: this.seedFills(),\n    markets: this.buildMarkets(),\n    equity: this.seedEquity(),\n    score: this.seedScore(),\n    nextId: 1,\n  };\n\n  clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }\n  tail(t) { return t.split(\"-\").pop(); }\n  catKey(c) { return c === \"weather\" ? \"weather\" : \"macro\"; }\n  evShort(t) { if (t.indexOf(\"KXHIGH\") === 0) return \"NYC\"; if (t.indexOf(\"KXJOBLESS\") === 0) return \"CLAIMS\"; return \"CPI\"; }\n  evLong(t) { if (t.indexOf(\"KXHIGH\") === 0) return \"NYC HIGH\"; if (t.indexOf(\"KXJOBLESS\") === 0) return \"JOBLESS\"; return \"CORE CPI\"; }\n\n  buildMarkets() {\n    const mk = (o) => ({ flash: 0, bid: Math.round(o.mid - o.spread / 2), ask: Math.round(o.mid + o.spread / 2), ...o });\n    return [\n      mk({ ticker: \"KXHIGHNY-26JUN20-T77\", sub: \"77° or below\", cat: \"weather\", feeFree: true, model: 0.05, fair: 0.05, mid: 7, spread: 3, depth: 8 }),\n      mk({ ticker: \"KXHIGHNY-26JUN20-B79\", sub: \"78° to 79°\", cat: \"weather\", feeFree: true, model: 0.12, fair: 0.13, mid: 14, spread: 3, depth: 7 }),\n      mk({ ticker: \"KXHIGHNY-26JUN20-B81\", sub: \"80° to 81°\", cat: \"weather\", feeFree: true, model: 0.46, fair: 0.47, mid: 40, spread: 3, depth: 11 }),\n      mk({ ticker: \"KXHIGHNY-26JUN20-B83\", sub: \"82° to 83°\", cat: \"weather\", feeFree: true, model: 0.30, fair: 0.29, mid: 27, spread: 3, depth: 9 }),\n      mk({ ticker: \"KXHIGHNY-26JUN20-T83\", sub: \"84° or above\", cat: \"weather\", feeFree: true, model: 0.08, fair: 0.07, mid: 13, spread: 4, depth: 6 }),\n      mk({ ticker: \"KXJOBLESS-26JUN25-T220\", sub: \"Below 220k\", cat: \"macro\", feeFree: true, model: 0.22, fair: 0.21, mid: 19, spread: 3, depth: 7 }),\n      mk({ ticker: \"KXJOBLESS-26JUN25-B230\", sub: \"220k to 230k\", cat: \"macro\", feeFree: true, model: 0.42, fair: 0.43, mid: 36, spread: 3, depth: 10 }),\n      mk({ ticker: \"KXJOBLESS-26JUN25-B240\", sub: \"230k to 240k\", cat: \"macro\", feeFree: true, model: 0.27, fair: 0.27, mid: 28, spread: 3, depth: 8 }),\n      mk({ ticker: \"KXJOBLESS-26JUN25-T240\", sub: \"Above 240k\", cat: \"macro\", feeFree: true, model: 0.10, fair: 0.09, mid: 14, spread: 3, depth: 6 }),\n      mk({ ticker: \"KXCPICORE-26JUL11-B025\", sub: \"0.2% m/m\", cat: \"macro\", feeFree: false, model: 0.38, fair: 0.39, mid: 33, spread: 4, depth: 9 }),\n      mk({ ticker: \"KXCPICORE-26JUL11-B035\", sub: \"0.3% m/m\", cat: \"macro\", feeFree: false, model: 0.44, fair: 0.44, mid: 45, spread: 4, depth: 10 }),\n      mk({ ticker: \"KXCPICORE-26JUL11-T035\", sub: \"0.4% or more\", cat: \"macro\", feeFree: false, model: 0.18, fair: 0.17, mid: 20, spread: 4, depth: 7 }),\n    ];\n  }\n\n  seedEquity() {\n    const base = this.startCents, out = [], n = 34;\n    for (let i = 0; i < n; i++) out.push(Math.round(base + (i / (n - 1)) * 300 + (Math.random() - 0.5) * 16));\n    out[n - 1] = base + 313;\n    return out;\n  }\n\n  seedScore() {\n    return {\n      weather: { trades: 9, makerFills: 9, takerFills: 0, sumEdge: 0.62, realizedNet: 235, brierSum: 0.61, brierN: 6, maxDD: 0.028, fees: 0 },\n      macro: { trades: 6, makerFills: 4, takerFills: 2, sumEdge: 0.30, realizedNet: 78, brierSum: 0.97, brierN: 5, maxDD: 0.052, fees: 11 },\n    };\n  }\n\n  seedFills() {\n    const t = Date.UTC(2026, 5, 20, 13, 35, 0);\n    return [\n      { t: t - 240000, tail: \"B81\", ev: \"NYC\", title: \"NYC HIGH · 80° to 81°\", liq: \"MAKER\", kind: \"maker\", side: \"YES\", qty: 2, price: 39, note: \"queue 0\", fresh: 0 },\n      { t: t - 600000, tail: \"B230\", ev: \"CLAIMS\", title: \"JOBLESS · 220k to 230k\", liq: \"MAKER\", kind: \"maker\", side: \"YES\", qty: 1, price: 35, note: \"queue 0\", fresh: 0 },\n      { t: t - 1500000, tail: \"B81\", ev: \"NYC\", title: \"NYC HIGH · 80° to 81°\", liq: \"SETTLED\", kind: \"win\", side: \"WON\", qty: 3, price: 100, note: \"+$1.83\", fresh: 0 },\n      { t: t - 2100000, tail: \"B025\", ev: \"CPI\", title: \"CORE CPI · 0.2% m/m\", liq: \"TAKER\", kind: \"taker\", side: \"YES\", qty: 1, price: 34, note: \"slip 1¢\", fresh: 0 },\n    ];\n  }\n\n  componentDidMount() { this.startTimer(); }\n  componentWillUnmount() { clearInterval(this._timer); }\n\n  delay() { return this.state.speed === 1 ? 1500 : this.state.speed === 16 ? 220 : 620; }\n  startTimer() {\n    clearInterval(this._timer);\n    if (!this.state.running) return;\n    this._timer = setInterval(() => this.setState((s) => this.advance(s)), this.delay());\n  }\n\n  toggleRun = () => this.setState((s) => ({ running: !s.running }), () => this.startTimer());\n  setSpeed = (n) => this.setState({ speed: n }, () => this.startTimer());\n  setFill = (m) => this.setState({ fillModel: m });\n  setMtm = (m) => this.setState({ mtm: m });\n  reset = () => {\n    clearInterval(this._timer);\n    this.setState({\n      running: true, speed: 4, tick: 142, simMs: Date.UTC(2026, 5, 20, 13, 35, 0),\n      wallet: { cash: this.startCents + 313, reserved: 0, fees: 11 },\n      positions: {}, orders: [], fills: this.seedFills(), markets: this.buildMarkets(),\n      equity: this.seedEquity(), score: this.seedScore(), nextId: 1,\n    }, () => this.startTimer());\n  };\n\n  advance(prev) {\n    const clamp = (x, a, b) => Math.max(a, Math.min(b, x));\n    const S = structuredClone(prev);\n    S.tick += 1;\n    S.simMs += 300000;\n    for (const m of S.markets) {\n      m.flash = 0;\n      const target = m.fair * 100;\n      let mid = (m.bid + m.ask) / 2;\n      mid += (target - mid) * 0.045 + (Math.random() - 0.5) * 1.2;\n      mid = clamp(mid, 2.5, 97.5);\n      let bid = Math.round(mid - m.spread / 2);\n      let ask = Math.round(mid + m.spread / 2);\n      bid = clamp(bid, 1, 98); ask = clamp(ask, bid + 1, 99);\n      if (ask > m.ask || bid > m.bid) m.flash = 1; else if (ask < m.ask || bid < m.bid) m.flash = -1;\n      m.bid = bid; m.ask = ask;\n    }\n    this.placeOrders(S);\n    this.processFills(S);\n    if (S.tick % 16 === 0) this.settleOne(S);\n    const markP = (m) => (S.mtm === \"mid\" ? (m.bid + m.ask) / 2 : m.bid);\n    let posVal = 0;\n    for (const t in S.positions) { const p = S.positions[t]; const m = S.markets.find((x) => x.ticker === t); if (m) posVal += markP(m) * p.count; }\n    const equity = S.wallet.cash + S.wallet.reserved + posVal;\n    S.equity.push(Math.round(equity));\n    if (S.equity.length > 96) S.equity.shift();\n    for (const f of S.fills) if (f.fresh > 0) f.fresh -= 1;\n    return S;\n  }\n\n  placeOrders(S) {\n    const clamp = (x, a, b) => Math.max(a, Math.min(b, x));\n    const open = new Set(S.orders.map((o) => o.ticker));\n    let best = null, bestEdge = 0;\n    for (const m of S.markets) {\n      if (open.has(m.ticker) || S.positions[m.ticker]) continue;\n      const edge = m.model - m.ask / 100;\n      const thr = m.feeFree ? 0.05 : 0.085;\n      if (edge < thr) continue;\n      if (edge > bestEdge) { bestEdge = edge; best = m; }\n    }\n    if (!best) return;\n    const m = best, price = m.bid;\n    const maxByStake = Math.max(1, Math.floor(500 / price));\n    const edge = m.model - price / 100;\n    let count = clamp(Math.round(edge * 8) + 1, 1, 3);\n    count = Math.min(count, maxByStake);\n    const feeC = m.feeFree ? 0 : Math.max(1, Math.ceil(7 * (price / 100) * (1 - price / 100)));\n    const cost = price * count + feeC * count;\n    if (cost > S.wallet.cash) return;\n    S.wallet.cash -= cost;\n    S.wallet.reserved += cost;\n    S.orders.push({ id: S.nextId++, ticker: m.ticker, sub: m.sub, cat: m.cat, price, count, filled: 0, queueAhead: m.depth, feeC, model: m.model });\n  }\n\n  processFills(S) {\n    const remain = [];\n    for (const o of S.orders) {\n      let v;\n      if (S.fillModel === \"level0\") { v = o.count; o.queueAhead = 0; }\n      else { v = Math.random() < 0.6 ? Math.floor(Math.random() * 4) : 0; if (S.fillModel === \"level2\") v = Math.round(v * 1.5); }\n      if (o.queueAhead > 0) { const c = Math.min(v, o.queueAhead); o.queueAhead -= c; v -= c; }\n      if (v > 0 && o.filled < o.count) {\n        const fillN = Math.min(v, o.count - o.filled);\n        o.filled += fillN;\n        const spent = o.price * fillN + o.feeC * fillN;\n        S.wallet.reserved -= spent;\n        S.wallet.fees += o.feeC * fillN;\n        const p = S.positions[o.ticker];\n        if (p) { const nc = p.count + fillN; p.avgCost = (p.avgCost * p.count + o.price * fillN) / nc; p.count = nc; }\n        else S.positions[o.ticker] = { count: fillN, avgCost: o.price, cat: o.cat, sub: o.sub };\n        const sc = S.score[this.catKey(o.cat)];\n        sc.trades += 1; sc.makerFills += 1; sc.sumEdge += (o.model - o.price / 100); sc.fees += o.feeC * fillN;\n        S.fills.unshift({ t: S.simMs, tail: this.tail(o.ticker), ev: this.evShort(o.ticker), title: this.evLong(o.ticker) + \" · \" + o.sub, liq: o.feeC ? \"MAKER·FEE\" : \"MAKER\", kind: \"maker\", side: \"YES\", qty: fillN, price: o.price, note: \"queue 0\", fresh: 3 });\n        if (S.fills.length > 18) S.fills.pop();\n      }\n      if (o.filled < o.count) remain.push(o);\n    }\n    S.orders = remain;\n  }\n\n  settleOne(S) {\n    const ts = Object.keys(S.positions);\n    if (!ts.length) return;\n    const t = ts[Math.floor(Math.random() * ts.length)];\n    const p = S.positions[t];\n    const m = S.markets.find((x) => x.ticker === t);\n    if (!m) { delete S.positions[t]; return; }\n    const outcome = Math.random() < m.fair ? 1 : 0;\n    const payout = outcome ? 100 : 0;\n    S.wallet.cash += payout * p.count;\n    const realized = (payout - p.avgCost) * p.count;\n    const sc = S.score[this.catKey(m.cat)];\n    sc.realizedNet += realized;\n    sc.brierSum += Math.pow(m.model - outcome, 2);\n    sc.brierN += 1;\n    S.fills.unshift({ t: S.simMs, tail: this.tail(t), ev: this.evShort(t), title: this.evLong(t) + \" · \" + p.sub, liq: \"SETTLED\", kind: realized >= 0 ? \"win\" : \"loss\", side: outcome ? \"WON\" : \"LOST\", qty: p.count, price: payout, note: (realized >= 0 ? \"+\" : \"−\") + \"$\" + (Math.abs(realized) / 100).toFixed(2), fresh: 3 });\n    if (S.fills.length > 18) S.fills.pop();\n    delete S.positions[t];\n    S.orders = S.orders.filter((o) => o.ticker !== t);\n  }\n\n  dol(c) { return \"$\" + (c / 100).toFixed(2); }\n  sdol(c) { return (c >= 0 ? \"+\" : \"−\") + \"$\" + (Math.abs(c) / 100).toFixed(2); }\n  pp(x) { return Math.round(x * 100) + \"%\"; }\n  seg(active) {\n    return { display: \"inline-flex\", alignItems: \"center\", gap: \"5px\", padding: \"5px 9px\", fontSize: \"11px\", fontFamily: \"'Geist Mono',monospace\", letterSpacing: \".03em\", border: \"1px solid \" + (active ? \"#2e9df1\" : \"#2e2e33\"), background: active ? \"rgba(46,157,241,.15)\" : \"transparent\", color: active ? \"#9fd3f7\" : \"#a1a1aa\", borderRadius: \"6px\", cursor: \"pointer\" };\n  }\n  miniSeg(active) {\n    return { fontFamily: \"'Geist Mono',monospace\", fontSize: \"10px\", padding: \"1px 5px\", borderRadius: \"4px\", border: \"1px solid \" + (active ? \"#2e9df1\" : \"#2e2e33\"), background: active ? \"rgba(46,157,241,.16)\" : \"transparent\", color: active ? \"#9fd3f7\" : \"#71717a\", cursor: \"pointer\", marginLeft: \"2px\" };\n  }\n\n  rowFor(m, S) {\n    const POS = \"#3ECf8E\", NEG = \"#F2666B\";\n    const markP = S.mtm === \"mid\" ? (m.bid + m.ask) / 2 : m.bid;\n    const edge = m.model - m.ask / 100;\n    const thr = m.feeFree ? 0.05 : 0.085;\n    const pos = S.positions[m.ticker];\n    const ord = S.orders.find((o) => o.ticker === m.ticker);\n    const barModel = this.clamp(m.model * 100, 0, 100);\n    const barMkt = this.clamp((m.bid + m.ask) / 2, 0, 100);\n    const lo = Math.min(barModel, barMkt), hi = Math.max(barModel, barMkt);\n    const arrow = m.flash === 1 ? \" ▲\" : m.flash === -1 ? \" ▼\" : \"\";\n    let sig = \"—\", sigColor = \"#52525b\", sigBg = \"transparent\";\n    if (pos) { sig = \"OWN\"; sigColor = \"#7fc2f4\"; sigBg = \"rgba(46,157,241,.14)\"; }\n    else if (ord) { sig = \"RESTING\"; sigColor = \"#E0A33E\"; sigBg = \"rgba(224,163,62,.12)\"; }\n    else if (edge >= thr) { sig = \"EDGE\"; sigColor = \"#3ECf8E\"; sigBg = \"rgba(62,207,142,.12)\"; }\n    let posStr = \"—\", posColor = \"#52525b\";\n    if (pos) { posStr = pos.count + \" @ \" + Math.round(pos.avgCost) + \"¢\"; posColor = \"#c8c8cf\"; }\n    else if (ord) { posStr = \"rest \" + (ord.count - ord.filled) + \"@\" + ord.price; posColor = \"#9a7a3e\"; }\n    return {\n      sub: m.sub, meta: this.evShort(m.ticker) + \" · \" + this.tail(m.ticker) + arrow,\n      modelStr: this.pp(m.model), mktStr: Math.round((m.bid + m.ask) / 2) + \"¢\",\n      edgeStr: (edge >= 0 ? \"+\" : \"−\") + Math.abs(edge * 100).toFixed(1), edgeColor: edge >= thr ? POS : edge <= -0.03 ? NEG : \"#6b6b73\",\n      bookStr: m.bid + \"·\" + m.ask, posStr, posColor, sig, sigColor, sigBg,\n      barModel, barMkt, gapLeft: lo, gapWidth: Math.max(hi - lo, 0), gapColor: m.model > (m.bid + m.ask) / 200 * 100 ? \"#3ECf8E\" : \"#F2666B\",\n    };\n  }\n\n  renderVals() {\n    const S = this.state;\n    const POS = \"#3ECf8E\", NEG = \"#F2666B\", NEU = \"#e8e8ec\";\n    const markP = (m) => (S.mtm === \"mid\" ? (m.bid + m.ask) / 2 : m.bid);\n    let posVal = 0, unrealW = 0, unrealM = 0, posCount = 0;\n    for (const t in S.positions) {\n      const p = S.positions[t]; const m = S.markets.find((x) => x.ticker === t); if (!m) continue;\n      const mp = markP(m); posVal += mp * p.count; posCount += 1;\n      const u = (mp - p.avgCost) * p.count;\n      if (m.cat === \"weather\") unrealW += u; else unrealM += u;\n    }\n    const equity = S.wallet.cash + S.wallet.reserved + posVal;\n    const unreal = unrealW + unrealM;\n    const totalPnl = equity - this.startCents;\n\n    // chart\n    const eq = S.equity;\n    const n = eq.length, W = 1000, H = 208, padT = 14, padB = 18;\n    const lo = Math.min(...eq, this.startCents), hi = Math.max(...eq, this.startCents);\n    const range = Math.max(hi - lo, 30), pad = range * 0.18;\n    const yMin = lo - pad, yMax = hi + pad;\n    const X = (i) => (n <= 1 ? 0 : (i / (n - 1)) * W);\n    const Y = (v) => padT + (1 - (v - yMin) / (yMax - yMin)) * (H - padT - padB);\n    let path = \"\", area = \"\";\n    eq.forEach((v, i) => { const x = X(i).toFixed(1), y = Y(v).toFixed(1); path += (i === 0 ? \"M\" : \"L\") + x + \" \" + y + \" \"; });\n    area = path + \"L1000 \" + (H - padB) + \" L0 \" + (H - padB) + \" Z\";\n    const baselineY = Y(this.startCents);\n    // drawdown\n    let peak = -Infinity, maxDD = 0;\n    for (const v of eq) { if (v > peak) peak = v; const dd = (peak - v) / peak; if (dd > maxDD) maxDD = dd; }\n\n    // scorecard\n    const w = S.score.weather, mc = S.score.macro;\n    const wNet = w.realizedNet + unrealW, mNet = mc.realizedNet + unrealM;\n    const wBrier = w.brierSum / w.brierN, mBrier = mc.brierSum / mc.brierN;\n    const wFill = w.makerFills / Math.max(1, w.makerFills + w.takerFills);\n    const mFill = mc.makerFills / Math.max(1, mc.makerFills + mc.takerFills);\n    const wEdge = w.sumEdge / Math.max(1, w.trades), mEdge = mc.sumEdge / Math.max(1, mc.trades);\n    const L = \"#cfcfd4\", D = \"#6b6b73\";\n    const col = (lead) => (lead ? \"#fafafa\" : \"#8a8a93\");\n    const scoreRows = [\n      { label: \"Net P&L\", hint: \"realized + unrealized, net of fees\", wVal: this.sdol(wNet - w.fees), mVal: this.sdol(mNet - mc.fees), wColor: wNet >= mNet ? POS : \"#8a8a93\", mColor: mNet > wNet ? POS : \"#8a8a93\" },\n      { label: \"Brier score\", hint: \"lower = better calibrated\", wVal: wBrier.toFixed(3), mVal: mBrier.toFixed(3), wColor: col(wBrier <= mBrier), mColor: col(mBrier < wBrier) },\n      { label: \"Maker fill rate\", hint: \"share filled as maker\", wVal: this.pp(wFill), mVal: this.pp(mFill), wColor: col(wFill >= mFill), mColor: col(mFill > wFill) },\n      { label: \"Trades settled\", hint: \"calibration sample size\", wVal: String(w.brierN), mVal: String(mc.brierN), wColor: col(w.brierN >= mc.brierN), mColor: col(mc.brierN > w.brierN) },\n      { label: \"Avg edge captured\", hint: \"model − entry price\", wVal: \"+\" + (wEdge * 100).toFixed(1) + \"pp\", mVal: \"+\" + (mEdge * 100).toFixed(1) + \"pp\", wColor: col(wEdge >= mEdge), mColor: col(mEdge > wEdge) },\n      { label: \"Max drawdown\", hint: \"lower = steadier equity\", wVal: this.pp(w.maxDD), mVal: this.pp(mc.maxDD), wColor: col(w.maxDD <= mc.maxDD), mColor: col(mc.maxDD < w.maxDD) },\n      { label: \"Fees paid\", hint: \"maker-free weather wins here\", wVal: this.dol(w.fees), mVal: this.dol(mc.fees), wColor: col(w.fees <= mc.fees), mColor: col(mc.fees < w.fees) },\n    ];\n    const wLeads = wNet >= mNet;\n    const leaderTag = wLeads ? \"WEATHER LEADS\" : \"MACRO LEADS\";\n    const leaderBlurb = wLeads\n      ? \"Weather is better calibrated and maker-free, so its edge survives fees. Front-runner for the $50 pilot — keep the shadow window open.\"\n      : \"Macro is ahead on net P&L this window, but CPI maker fees and a smaller calibration sample warrant more data before deciding.\";\n\n    // fills\n    const fillRows = S.fills.map((f) => {\n      const d = new Date(f.t);\n      const time = String(d.getUTCHours()).padStart(2, \"0\") + \":\" + String(d.getUTCMinutes()).padStart(2, \"0\");\n      let liqColor = \"#7fc2f4\", liqBg = \"rgba(46,157,241,.14)\";\n      if (f.kind === \"win\") { liqColor = \"#3ECf8E\"; liqBg = \"rgba(62,207,142,.13)\"; }\n      else if (f.kind === \"loss\") { liqColor = \"#F2666B\"; liqBg = \"rgba(242,102,107,.13)\"; }\n      else if (f.kind === \"taker\") { liqColor = \"#E0A33E\"; liqBg = \"rgba(224,163,62,.13)\"; }\n      const noteColor = f.kind === \"win\" ? \"#3ECf8E\" : f.kind === \"loss\" ? \"#F2666B\" : f.kind === \"taker\" ? \"#b58a3e\" : \"#6b6b73\";\n      const detail = f.liq === \"SETTLED\" ? (f.side + \" · \" + f.qty + \" contracts @ \" + f.price + \"¢\") : (f.side + \" · ×\" + f.qty + \" @ \" + f.price + \"¢\");\n      return { time, liq: f.liq, liqColor, liqBg, title: f.title, detail, note: f.note, noteColor, bg: f.fresh > 0 ? \"rgba(46,157,241,.06)\" : \"transparent\" };\n    });\n\n    const dd = new Date(S.simMs);\n    const clockStr = String(dd.getUTCHours()).padStart(2, \"0\") + \":\" + String(dd.getUTCMinutes()).padStart(2, \"0\");\n\n    return {\n      runLabel: S.running ? \"RUNNING\" : \"PAUSED\",\n      dotColor: S.running ? \"#3ECf8E\" : \"#E0A33E\",\n      clockStr, tickStr: String(S.tick), cashFlag: String(this.props.startingCash ?? 50),\n      runId: \"26jun20-fwd\",\n      toggleRun: this.toggleRun, reset: this.reset,\n      speed1: () => this.setSpeed(1), speed4: () => this.setSpeed(4), speed16: () => this.setSpeed(16),\n      s1Style: this.seg(S.speed === 1), s4Style: this.seg(S.speed === 4), s16Style: this.seg(S.speed === 16),\n      runBtnLabel: S.running ? \"❚❚ PAUSE\" : \"▶ RESUME\",\n      runBtnStyle: { display: \"inline-flex\", alignItems: \"center\", gap: \"5px\", padding: \"5px 11px\", fontSize: \"11px\", fontFamily: \"'Geist Mono',monospace\", letterSpacing: \".04em\", border: \"1px solid \" + (S.running ? \"#2e2e33\" : \"#2e9df1\"), background: S.running ? \"transparent\" : \"rgba(46,157,241,.15)\", color: S.running ? \"#cfcfd4\" : \"#9fd3f7\", borderRadius: \"6px\", cursor: \"pointer\", fontWeight: 600 },\n      mtmBid: () => this.setMtm(\"bid\"), mtmMid: () => this.setMtm(\"mid\"),\n      bidStyle: this.miniSeg(S.mtm === \"bid\"), midStyle: this.miniSeg(S.mtm === \"mid\"),\n      fill1: () => this.setFill(\"level1\"), fill2: () => this.setFill(\"level2\"), fill0: () => this.setFill(\"level0\"),\n      f1Style: this.miniSeg(S.fillModel === \"level1\"), f2Style: this.miniSeg(S.fillModel === \"level2\"), f0Style: this.miniSeg(S.fillModel === \"level0\"),\n      fillChip: S.fillModel === \"level0\" ? \"L0 optimistic\" : S.fillModel === \"level2\" ? \"L2 probabilistic\" : \"L1 trade-through\",\n      mtmLabel: S.mtm,\n\n      equityStr: this.dol(equity), pnlStr: this.sdol(totalPnl), pnlColor: totalPnl >= 0 ? POS : NEG,\n      startStr: this.dol(this.startCents), deltaStr: (totalPnl >= 0 ? \"+\" : \"−\") + (Math.abs(totalPnl / this.startCents) * 100).toFixed(2) + \"%\",\n      cashStr: this.dol(S.wallet.cash), reservedStr: this.dol(S.wallet.reserved),\n      unrealStr: this.sdol(Math.round(unreal)), unrealColor: unreal >= 0 ? POS : NEG,\n      realStr: this.sdol(w.realizedNet + mc.realizedNet), realColor: (w.realizedNet + mc.realizedNet) >= 0 ? POS : NEG,\n      feesStr: this.dol(S.wallet.fees), posCountStr: String(posCount), ddStr: this.pp(maxDD),\n\n      equityPath: path.trim(), equityArea: area, baselineY: baselineY.toFixed(1),\n      dotX: X(n - 1).toFixed(1), dotY: Y(eq[n - 1]).toFixed(1),\n      hiLabel: this.dol(hi), loLabel: this.dol(lo), baseLabelTop: (baselineY - 7).toFixed(0) + \"px\",\n\n      weatherRows: S.markets.filter((m) => m.cat === \"weather\").map((m) => this.rowFor(m, S)),\n      macroRows: S.markets.filter((m) => m.cat === \"macro\").map((m) => this.rowFor(m, S)),\n      scoreRows, leaderTag, leaderBlurb, fillRows,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
